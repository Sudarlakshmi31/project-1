
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudar Lakshmi & Ram Prasath | Wedding</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff8ed;
      font-family: Georgia, serif;
      color: #781b35;
      text-align: center;
    }
    .card {
      margin: 20px;
      padding: 40px 24px;
      max-width: 380px;
      border: 2px solid #c9a45c;
      background: #fffdf8;
      box-shadow: 0 10px 30px #781b3520;
      animation: appear 1.2s ease;
    }
    h1 { font-size: 34px; line-height: 1.4; font-weight: normal; }
    .symbol { font-size: 38px; color: #b58b43; }
    p { line-height: 1.8; }
    a {
      display: inline-block;
      padding: 12px 18px;
      margin-top: 12px;
      background: #781b35;
      color: white;
      text-decoration: none;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="card">
    <p>WITH THE BLESSINGS OF OUR FAMILIES</p>
    <div class="symbol">✦ ❀ ✦</div>
    <h1>Sudar Lakshmi<br>&amp;<br>Ram Prasath</h1>
    <p>With the blessings of Lord Nellaiappar and Goddess Kanthimathi, we invite you to celebrate our wedding.</p>
    <div class="symbol">❦</div>
    <h2>December 6</h2>
    <p>Nellaiappar Temple<br>Tirunelveli, Tamil Nadu</p>
    <a href="https://www.google.com/maps/search/?api=1&query=Nellaiappar+Temple+Tirunelveli" target="_blank">View Temple Location</a>
  </main>
</body>
</html>
